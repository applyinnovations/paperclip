# Nightly (xlab-deployments nightly-cron-trigger, PaC incoming webhook):
# fast-forward master to upstream and open a PR merging upstream's newest
# stable release into xlab. See .xlab/README.md.
# plan runs .xlab/upstream-intake.sh in sandboxed Nix with no credentials and
# writes a plan; publish holds the GitHub token and the deploy key and takes
# every commit it pushes from upstream itself. Its scripts (.xlab/intake-push.sh,
# .xlab/intake_pr.py) come from clone-trusted, a separate checkout of this run's
# revision that the plan task never mounts, so nothing plan ran can change them.
# publish pushes with paperclip-intake-deploy-key, a write deploy key for this
# fork: upstream changes .github/workflows/, which the PaC GitHub App may not
# push (no workflows permission, by design), and the "master mirrors upstream"
# ruleset lets only this key (and the App) update master. Actions is disabled
# on the fork, so those workflow files never run here. The pull request is
# opened with the run's PaC App token.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: upstream-sync-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[xlab]"
    pipelinesascode.tekton.dev/target-namespace: tekton-buildkit
    pipelinesascode.tekton.dev/max-keep-runs: "7"
spec:
  params:
    - name: revision
      value: "{{ revision }}"
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        storage.xlab.now/fast-local: "true"
  taskRunSpecs:
    - pipelineTaskName: plan
      podTemplate:
        hostUsers: false
  timeouts:
    pipeline: 30m
  pipelineSpec:
    params:
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: git-auth
      - name: intake-deploy-key
      - name: plan
      - name: trusted
    tasks:
      - name: clone
        timeout: 10m
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: git-clone-v1 }
            - { name: namespace, value: tekton-pipelines }
        params:
          - { name: url, value: https://github.com/applyinnovations/paperclip.git }
          - { name: revision, value: $(params.revision) }
          - { name: expectedCommitSha, value: $(params.revision) }
          # The plan needs full history for merge bases and every blob for
          # its trial merge: a blob:none clone would fetch missing blobs only
          # from this fork, which lacks upstream's newer objects.
          - { name: depth, value: "0" }
          - { name: objectFilter, value: none }
        workspaces:
          - { name: output, workspace: source }
          - { name: basic-auth, workspace: git-auth }
      # The publish task's scripts: the same revision, cloned into a
      # workspace only publish mounts.
      - name: clone-trusted
        timeout: 10m
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: git-clone-v1 }
            - { name: namespace, value: tekton-pipelines }
        params:
          - { name: url, value: https://github.com/applyinnovations/paperclip.git }
          - { name: revision, value: $(params.revision) }
          - { name: expectedCommitSha, value: $(params.revision) }
          - { name: sparseCheckoutPatterns, value: /.xlab/ }
        workspaces:
          - { name: output, workspace: trusted }
          - { name: basic-auth, workspace: git-auth }
      - name: plan
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: nix-v1 }
            - { name: namespace, value: tekton-buildkit }
        params:
          - name: SCRIPT
            value: nix develop ./.xlab --command .xlab/upstream-intake.sh "${CI_ARTIFACTS_PATH}/intake"
        workspaces:
          - { name: source, workspace: source }
          - { name: artifacts, workspace: plan }
      - name: publish
        runAfter: [plan, clone-trusted]
        workspaces:
          - { name: plan, workspace: plan }
          - { name: trusted, workspace: trusted }
          - { name: git-auth, workspace: git-auth }
          - { name: deploy-key, workspace: intake-deploy-key }
        taskSpec:
          workspaces:
            - name: plan
              readOnly: true
            - name: trusted
              readOnly: true
            - name: git-auth
              readOnly: true
            - name: deploy-key
              readOnly: true
          volumes:
            # This pod's own scratch on scratch-local; deleted with the pod and
            # emptied by each step on exit.
            - name: work
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    storageClassName: scratch-local
                    resources:
                      requests:
                        storage: 5Gi
          steps:
            # Fast-forward master and push upstream/<tag> at the release
            # commit (.xlab/intake-push.sh).
            - name: push
              image: docker.io/alpine/git:2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - { name: work, mountPath: /work }
              script: |
                #!/bin/sh
                set -eu
                exec sh "$(workspaces.trusted.path)/.xlab/intake-push.sh" "$(workspaces.plan.path)/intake" "$(workspaces.deploy-key.path)/ssh-privatekey" /work
            # Open the PR, label it and enable auto-merge as the plan says
            # (.xlab/intake_pr.py).
            - name: pull-request
              image: python:3.13-alpine@sha256:2dd78ad5cf13a0b68f5134dc49aa9950203a8cf4b7463431b9f3b398287c5059
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - { name: work, mountPath: /work }
              script: |
                #!/bin/sh
                set -eu
                exec python3 -I "$(workspaces.trusted.path)/.xlab/intake_pr.py" "$(workspaces.plan.path)/intake" /work/pushed-tag "$(workspaces.git-auth.path)/git-provider-token"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: scratch-local
          resources:
            requests:
              storage: 5Gi
    - name: git-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    # Key ssh-privatekey; write deploy key for this fork (see top).
    - name: intake-deploy-key
      secret:
        secretName: paperclip-intake-deploy-key
    # .xlab/ at this run's revision, for publish only.
    - name: trusted
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: scratch-local
          resources:
            requests:
              storage: 1Gi
    # The plan task's output for publish: a few small files.
    - name: plan
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: scratch-local
          resources:
            requests:
              storage: 1Gi
