# Nightly full test suite on xlab, triggered through the PaC incoming webhook
# by deployments' nightly-cron-trigger. Not a required check; failures show
# on the xlab commit. Pull requests, including upstream intake ones, test only
# what differs from tested source (.xlab/ci.sh).
#
# The suite runs as upstream's CI shards it, packed into the lanes of
# .xlab/full-test-lanes.txt: one pod per lane, in parallel, each with its own
# clone, install and build (nix-v1 clone mode). On one pod it no longer fit
# its 4 hours (test-full-wjtgv, 27 Nov 2026, APP-749). The run binds no
# volume, so it gets no affinity assistant and each lane goes to whichever
# worker has room. It warms no Nix cache: that needs a shared claim, which
# would pin every lane to one node.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: test-full-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[xlab]"
    pipelinesascode.tekton.dev/target-namespace: tekton-buildkit
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  params:
    - name: revision
      value: "{{ revision }}"
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  timeouts:
    pipeline: 100m
  taskRunSpecs:
    - pipelineTaskName: lanes
      podTemplate:
        hostUsers: false
      stepSpecs:
        # Each lane's peak is its build (~6.8 GiB RSS in test-full-wjtgv);
        # the serial run's tests held 2.6-4.5 GiB with one file at a time, and
        # a server shard runs three. Five lanes at 6 GiB fit the ~36 GiB the
        # two workers have beside their services at night. Measure and
        # resize from the lanes' own peaks.
        - name: run
          computeResources:
            requests: { cpu: "3", memory: 6Gi }
            limits: { memory: 16Gi }
  pipelineSpec:
    params:
      - name: revision
        type: string
    workspaces:
      - name: git-auth
    tasks:
      - name: lanes
        # About 40 minutes by upstream's file durations; the slack covers a
        # lane that waits for room.
        timeout: 90m
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: nix-v1 }
            - { name: namespace, value: tekton-buildkit }
        params:
          - { name: URL, value: https://github.com/applyinnovations/paperclip.git }
          - { name: REVISION, value: $(params.revision) }
        matrix:
          params:
            - name: SCRIPT
              value:
                - CI_TEST_SCOPE=lane CI_TEST_LANE=1 nix develop ./.xlab --command .xlab/ci.sh
                - CI_TEST_SCOPE=lane CI_TEST_LANE=2 nix develop ./.xlab --command .xlab/ci.sh
                - CI_TEST_SCOPE=lane CI_TEST_LANE=3 nix develop ./.xlab --command .xlab/ci.sh
                - CI_TEST_SCOPE=lane CI_TEST_LANE=4 nix develop ./.xlab --command .xlab/ci.sh
                - CI_TEST_SCOPE=lane CI_TEST_LANE=5 nix develop ./.xlab --command .xlab/ci.sh
        workspaces:
          - { name: basic-auth, workspace: git-auth }
  workspaces:
    - name: git-auth
      secret:
        secretName: "{{ git_auth_secret }}"
