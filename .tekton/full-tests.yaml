# Nightly full test suite on xlab (40+ minutes), triggered through the PaC
# incoming webhook by xlab-deployments' nightly-cron-trigger. Not a required
# check; failures show on the xlab commit.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: paperclip-full-tests-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[xlab]"
    pipelinesascode.tekton.dev/target-namespace: tekton-buildkit
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  params:
    - name: revision
      value: "{{ revision }}"
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        storage.xlab.now/fast-local: "true"
  timeouts:
    pipeline: 120m
  taskRunSpecs:
    - pipelineTaskName: checks
      podTemplate:
        hostUsers: false
    - pipelineTaskName: publish-cache
      serviceAccountName: nix-cache-publisher
  pipelineSpec:
    params:
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: git-auth
      - name: nix-cache-export
    tasks:
      - name: clone
        timeout: 10m
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: git-clone-v1 }
            - { name: namespace, value: tekton-pipelines }
        params:
          - { name: url, value: https://github.com/applyinnovations/paperclip.git }
          - { name: revision, value: $(params.revision) }
          - { name: expectedCommitSha, value: $(params.revision) }
        workspaces:
          - { name: output, workspace: source }
          - { name: basic-auth, workspace: git-auth }
      - name: checks
        timeout: 110m
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: nix-v1 }
            - { name: namespace, value: tekton-buildkit }
        params:
          - name: SCRIPT
            value: nix develop ./.xlab --command .xlab/ci.sh
        workspaces:
          - { name: source, workspace: source }
          - { name: nix-cache-export, workspace: nix-cache-export }
    # Scheduled runs publish what the checks exported to the shared Nix cache.
    finally:
      - name: publish-cache
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-cache-publish-v1
            - name: namespace
              value: tekton-pipelines
        workspaces:
          - name: nix-cache-export
            workspace: nix-cache-export
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast-local
          resources:
            requests:
              storage: 20Gi
    - name: git-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    # The checks' cache export (store paths the Nix cache lacks, written only
    # on scheduled runs) for publish-cache. The checks keep their own Nix store.
    - name: nix-cache-export
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: fast-local
          resources:
            requests:
              storage: 10Gi
