# On every push to xlab, ask xlab-containers to move its paperclip input to
# this commit and rebuild the server and agent images. Flux deploys the result.
# Holds only the shared incoming-webhook secret; never runs repository code.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: paperclip-ship-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[xlab]"
    pipelinesascode.tekton.dev/target-namespace: tekton-pipelines
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      automountServiceAccountToken: false
  timeouts:
    pipeline: 10m
  pipelineSpec:
    tasks:
      - name: request-image-build
        taskSpec:
          steps:
            - name: trigger
              image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                # curlimages/curl names its user (curl_user); runAsNonRoot needs a uid.
                runAsUser: 100
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: WEBHOOK_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: nightly-cron-webhook-key
                      key: secret
                # xlab-containers PipelineRun that bumps only the paperclip input.
                - name: TARGET_PIPELINERUN
                  value: xlab-containers-update-paperclip-
              script: |
                #!/bin/sh
                set -eu
                curl -fsS -H "Content-Type: application/json" -X POST \
                  http://pipelines-as-code-controller.pipelines-as-code.svc.cluster.local:8080/incoming \
                  -d "{\"repository\":\"xlab-containers\",\"branch\":\"main\",\"pipelinerun\":\"${TARGET_PIPELINERUN}\",\"secret\":\"${WEBHOOK_SECRET}\"}"
